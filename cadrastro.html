<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
  
<form id="formulario">
<fieldset>
    <legend>Cadrasto de endereço</legend>
        <P>CEP</P><input id="CEP" type="text" placeholder="Digite seu CEP"><br>
            <P>endereço</P><input id="endereço" type="text" class="" placeholder="digite seu endereço"><br>
            <p>complemento</p><input type="text" id="complemento" class="" placeholder="digite seu complemento"><br>
            <P>bairro</P><input type="text" id="bairro" placeholder="digite seu bairro"><br>
            <p>Cidade</p><input type="text" id="Cidade" class="" placeholder="digite sua Cidade"><br>
            <P>Telefone1</P><input type="text" id="telefone1" class="" placeholder="Digite seu telefone"><br>
            <p>complemento1</p><input type="text" id="complemento1" class="" placeholder="digite seu complemento1"><br>
            <P>Telefone2</P><input type="text" id="Telefone2" class="" placeholder="Digite seu telefone opcional"><br>
            <p>complemento2</p><input type="text" id="complemento2" class="" placeholder="digite seu complemento2 opcional"><br>
            <p>Celular</p><input type="text" id="Celular" class="" placeholder="digite o seu telefone numero"><br>
            <p>complemento3</p><input type="text" id="complemento3" class="" placeholder="Digite seu complemento3"><br>
        <p>fax</p><input type="text" id="fax" class="" placeholder="digite o seu fax"><br>
     <p>complemento4</p><input type="text" id="complemento4" class="" placeholder="digite seu complemento4"><br>
</fieldset>
</form>
</body>
</html>
